# deploy/nginx.conf
# nginx reverse proxy for the CPOI Streamlit dashboard.
#
# This config:
#   - Accepts HTTPS on the Tailscale interface only (100.x.x.x)
#   - Proxies to Streamlit on 127.0.0.1:8501
#   - Enforces TLS 1.3 minimum
#   - Adds security headers
#   - Blocks all access from non-Tailscale IPs at the network level
#     (enforce this separately via ufw: ufw allow in on tailscale0)
#
# Installation:
#   cp deploy/nginx.conf /etc/nginx/sites-available/cpoi
#   ln -s /etc/nginx/sites-available/cpoi /etc/nginx/sites-enabled/cpoi
#   nginx -t
#   systemctl reload nginx
#
# TLS certificate: use the Tailscale HTTPS cert feature or a self-signed cert.
#   tailscale cert <your-tailscale-hostname>
#   This produces /var/lib/tailscale/certs/<hostname>.crt and .key
#
# Replace TAILSCALE_IP and TAILSCALE_HOSTNAME with your actual values.

server {
    listen 80;
    server_name laptop-itbpbjvk.tailfa79e7.ts.net;

    # Redirect all HTTP to HTTPS. Tailscale traffic only reaches this
    # server if the client is on the Tailscale network.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name laptop-itbpbjvk.tailfa79e7.ts.net;

    # --- TLS ---
    ssl_certificate     /var/lib/tailscale/certs/laptop-itbpbjvk.tailfa79e7.ts.net.crt;
    ssl_certificate_key /var/lib/tailscale/certs/laptop-itbpbjvk.tailfa79e7.ts.net.key;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # --- Restrict to Tailscale subnet ---
    # Replace with your actual Tailscale CGNAT range (always 100.64.0.0/10).
    allow 100.64.0.0/10;
    deny all;

    # --- Proxy to Streamlit ---
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit requires WebSocket support for the live UI.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }

    # Streamlit health check endpoint -- used by systemd readiness probes if added.
    location /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # Block direct access to the database and intake directories
    # (defense in depth -- these paths are not served but the rule makes
    # the intent explicit).
    location ~* \.(db|db-shm|db-wal|xlsx)$ {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/cpoi_access.log;
    error_log  /var/log/nginx/cpoi_error.log warn;
}
